name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (${{ matrix.framework }})
      run: |
        dotnet test --configuration Release --no-build --verbosity normal \
          --framework ${{ matrix.framework }} \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:CoverletOutput=./TestResults/ \
          /p:Include="[NotifyGen.Generator]*" \
          /p:Exclude="[*]*.Program%2c[*]*.AssemblyInfo%2c[NotifyGen.Attributes]*" \
          /p:ThresholdType=line \
          /p:Threshold=80

    - name: Generate Coverage Report
      if: matrix.framework == 'net10.0'
      uses: danielpalme/ReportGenerator-GitHub-Action@5.2.0
      with:
        reports: '**/TestResults/*.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'HtmlInline_AzurePipelines;Cobertura;Badges'
        verbosity: 'Info'

    - name: Upload Coverage Report
      if: matrix.framework == 'net10.0'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coveragereport
        retention-days: 7

    - name: Upload coverage reports to Codecov
      if: matrix.framework == 'net10.0'
      uses: codecov/codecov-action@v4
      with:
        files: '**/TestResults/*.cobertura.xml'
        fail_ci_if_error: false
      continue-on-error: true

  mutation-testing:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Install Stryker.NET
      run: dotnet tool install --global dotnet-stryker

    - name: Restore dependencies
      run: dotnet restore

    - name: Run Mutation Testing
      run: |
        dotnet stryker \
          --project src/NotifyGen.Generator/NotifyGen.Generator.csproj \
          --test-project tests/NotifyGen.Tests/NotifyGen.Tests.csproj \
          --reporters "['html', 'json', 'progress']" \
          --threshold-high 90 \
          --threshold-low 80 \
          --threshold-break 70 \
          --concurrency 4 \
          --output StrykerOutput
      continue-on-error: true

    - name: Upload Mutation Report
      uses: actions/upload-artifact@v4
      with:
        name: mutation-report
        path: StrykerOutput
        retention-days: 7

  pack:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Pack
      run: dotnet pack --configuration Release --no-build --output ./nupkg

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
        retention-days: 7

    - name: Smoke consume packed analyzer
      shell: bash
      run: |
        set -euo pipefail
        smoke_dir="$(mktemp -d)"
        package_path="$(ls -1 ./nupkg/NotifyGen.*.nupkg | head -n1)"
        package_version="$(basename "$package_path" .nupkg | sed 's/^NotifyGen\.//')"
        mkdir -p "$smoke_dir/feed"
        cp "$package_path" "$smoke_dir/feed/"
        cat > "$smoke_dir/SmokeConsumer.nuget.config" <<EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local" value="$smoke_dir/feed" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
        </configuration>
        EOF
        # Strip leading indentation from the generated nuget.config
        sed -i 's/^        //' "$smoke_dir/SmokeConsumer.nuget.config"
        dotnet new classlib -n SmokeConsumer -o "$smoke_dir/SmokeConsumer" --framework net8.0 --force
        cp "$smoke_dir/SmokeConsumer.nuget.config" "$smoke_dir/SmokeConsumer/nuget.config"
        python3 - "$smoke_dir/SmokeConsumer/SmokeConsumer.csproj" "$package_version" <<'PY'
        import sys
        from pathlib import Path
        path = Path(sys.argv[1])
        version = sys.argv[2]
        text = path.read_text()
        if "NotifyGen" not in text:
            snippet = (
                "</PropertyGroup>\n\n"
                "  <ItemGroup>\n"
                f'    <PackageReference Include="NotifyGen" Version="{version}" />\n'
                "  </ItemGroup>"
            )
            text = text.replace("</PropertyGroup>", snippet, 1)
            path.write_text(text)
        PY
        cat > "$smoke_dir/SmokeConsumer/Person.cs" <<'EOF'
        using NotifyGen;
        namespace SmokeConsumer;
        [Notify]
        public partial class Person
        {
            private string _name = "";
        }
        EOF
        sed -i 's/^        //' "$smoke_dir/SmokeConsumer/Person.cs"
        rm -f "$smoke_dir/SmokeConsumer/Class1.cs"
        dotnet build "$smoke_dir/SmokeConsumer/SmokeConsumer.csproj" -c Release
        dll="$smoke_dir/SmokeConsumer/bin/Release/net8.0/SmokeConsumer.dll"
        test -f "$dll"
        strings "$dll" | grep -q "INotifyPropertyChanged"
        strings "$dll" | grep -q "get_Name"

  benchmarks:
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'run-benchmarks')

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Run Competitor Benchmarks
      run: |
        cd benchmarks/NotifyGen.Benchmarks
        dotnet run -c Release -f net9.0 -- --filter *CompetitorBenchmarks* --exporters json

    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmarks/NotifyGen.Benchmarks/BenchmarkDotNet.Artifacts
        retention-days: 30
